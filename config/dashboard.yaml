dashboard:
  title: "WW14 Dashboard"
  timezone: "Europe/Berlin"
  locale: "de-DE"
  refresh_seconds: 60

storage:
  database: "data/dashboard.db"

influxdb:
  enabled: ${INFLUXDB_ENABLED:-false}
  url: "${INFLUXDB_URL:-http://127.0.0.1:8086}"
  org: "${INFLUXDB_ORG:-ww14}"
  bucket: "${INFLUXDB_BUCKET:-loxone}"
  token: "${INFLUXDB_TOKEN:-}"
  discovery_range: "-30d"

climate:
  range: "-24h"
  window: "15m"
  cache_seconds: 60
  metrics:
    - id: temperature
      label: Temperatur
      measurement: climate
      field: temperature
      tags:
        room: WW14
      unit: "°C"
      decimals: 1
    - id: humidity
      label: Luftfeuchte
      measurement: climate
      field: humidity
      tags:
        room: WW14
      unit: "%"
      decimals: 0
    - id: co2
      label: CO₂
      measurement: climate
      field: co2
      tags:
        room: WW14
      unit: ppm
      decimals: 0
  demo_metrics:
    - { id: temperature, label: Temperatur, value: 21.6, unit: "°C", decimals: 1 }
    - { id: humidity, label: Luftfeuchte, value: 48, unit: "%", decimals: 0 }
    - { id: co2, label: CO₂, value: 620, unit: ppm, decimals: 0 }
    - { id: pressure, label: Luftdruck, value: 1017, unit: hPa, decimals: 0 }

deadlines:
  # Wird nur beim ersten Start einmalig in die lokale Datenbank übernommen.
  file: "data/deadlines.json"
  horizon_days: 365

events:
  # Wird nur beim ersten Start einmalig in die lokale Datenbank übernommen.
  file: "data/events.json"
  horizon_days: 90

departures:
  enabled: true
  base_url: "https://dbf.finalrewind.org"
  station: "Brandenburg Hbf"
  results_per_direction: 5
  cache_seconds: 60
  retry_seconds: 90
  stale_seconds: 1800

stocks:
  enabled: true
  provider: yahoo
  cache_seconds: 300
  symbols:
    - { symbol: "VNA.DE", label: Vonovia, currency: EUR, price: 27.5 }
    - { symbol: "SAP.DE", label: SAP, currency: EUR, price: 232.4 }
    - { symbol: "SIE.DE", label: Siemens, currency: EUR, price: 226.1 }
    - { symbol: "AAPL", label: Apple, currency: USD, price: 246.5 }

weather:
  enabled: true
  location: "Brandenburg an der Havel"
  latitude: 52.4125
  longitude: 12.5316
  timezone: "Europe/Berlin"
  forecast_days: 5
  cache_seconds: 900
  radar_cache_seconds: 120
  radar_retry_seconds: 120
  radar_stale_seconds: 21600

mensa:
  enabled: true
  base_url: "https://www.imensa.de/brandenburg-an-der-havel/mensa-brandenburg-an-der-havel"
  cache_seconds: 1800
  retry_seconds: 300
  stale_seconds: 43200

